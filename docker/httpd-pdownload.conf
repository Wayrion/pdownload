# Keep this server static-file only and make HTTP/2 available when clients support it.
ServerName localhost

<IfModule http2_module>
    Protocols h2 h2c http/1.1
    H2Direct on
</IfModule>

# Ensure byte range requests work for partial downloads.
AcceptPathInfo Off

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Disable compression to avoid Content-Length/Range ambiguity during testing.
<IfModule deflate_module>
    SetEnv no-gzip 1
</IfModule>
